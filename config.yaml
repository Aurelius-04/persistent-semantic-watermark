# config.yaml

project:
  name: semantic-watermark-demo
  seed: 2026

  # auto: 优先 CUDA，CUDA 不可用时自动使用 CPU
  # cpu: 强制使用 CPU
  # cuda: 强制使用默认 GPU
  # cuda:0 / cuda:1: 指定 GPU
  device: auto

  output_dir: outputs
  checkpoint_dir: outputs/checkpoints
  result_dir: outputs/results

model:
  # 体积较小，CPU 和 GPU 均可运行。
  generator_name: distilgpt2

  # 多语言语义编码器。
  encoder_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

  max_input_length: 128
  max_new_tokens: 80

  # 语义编码器只用于提取特征，不参与训练。
  freeze_encoder: true

  # 冻结生成模型主体，只训练少量参数。
  freeze_generator_backbone: true

  # GPU 显存不足时可以设为 true。
  # 开启后训练速度会降低，但能够减少显存占用。
  gradient_checkpointing: false

watermark:
  secret_key: 2026
  num_anchors: 8
  num_candidates: 4

  span_size: 12
  span_stride: 8

  quality_weight: 0.7
  watermark_weight: 0.3

  normalize_embeddings: true

generation:
  do_sample: true
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

  # 候选生成的批大小。
  # CPU 建议设为 1，GPU 可以使用 2～4。
  batch_size: 1

training:
  train_file: data/train.jsonl

  epochs: 1

  # CPU 默认建议使用 1。
  # 显存充足时可以改成 2 或 4。
  batch_size: 1

  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.05
  gradient_accumulation_steps: 2

  lambda_lm: 1.0
  lambda_semantic: 0.1
  lambda_persistence: 0.05

  persistence_noise_std: 0.02

  max_grad_norm: 1.0
  log_every: 5
  save_each_epoch: true

verification:
  probe_file: data/probes.jsonl

  text_threshold: 0.20
  model_threshold: 0.20
  joint_threshold: 0.20

  fusion_alpha: 0.7
  max_probe_samples: 10

data:
  train_file: data/train.jsonl
  probe_file: data/probes.jsonl

  prompt_field: prompt
  response_field: response
  language_field: language
  task_field: task

runtime:
  # auto: CUDA 上优先使用混合精度，CPU 上自动关闭。
  # fp16: 强制使用 FP16，仅适合支持 CUDA 的 GPU。
  # bf16: 使用 BF16，需要硬件支持。
  # fp32: CPU/GPU 均可用，最稳定。
  precision: auto

  # 仅在 CUDA 环境有效。
  allow_tf32: true

  # 设为 true 时启用 cuDNN benchmark。
  # 输入长度变化很大时不一定更快。
  cudnn_benchmark: false

  # DataLoader 参数。
  # CPU 演示和 Windows 环境建议保持 0。
  num_workers: 0
  pin_memory: true

  show_progress: true